# SmartStore broker. Chỉ dùng trong LAN; không mở cổng 1883 ra Internet.
# Bắt buộc đăng nhập. Tạo file passwd bằng scripts/mqtt-users.ps1 (không commit).
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
