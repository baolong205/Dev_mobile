name: smartstore-mqtt

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartstore-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config:/mosquitto/config:ro
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-p", "1883", "-t", "smartstore/health", "-m", "healthcheck", "-q", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s